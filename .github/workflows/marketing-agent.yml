name: Nova Metrics marketing agent

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post now even if one went out recently"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: marketing-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
      STAND_NO: ${{ vars.STAND_NO }}
      MODE: ${{ vars.MODE || 'review' }}
      USE_DEMO_SCREENSHOTS: ${{ vars.USE_DEMO_SCREENSHOTS || '0' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Research, write and design today's post
        run: python agent/run.py generate

      - name: Save the image so Make can fetch it
        run: |
          git config user.name "nova-marketing-agent"
          git config user.email "agent@users.noreply.github.com"
          git add out/images
          git diff --cached --quiet || (git commit -m "Marketing agent: new post image" && git push)
          sleep 20

      - name: Send to Make
        run: python agent/run.py publish

      - name: Save post history
        run: |
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Marketing agent: update post history" && git push)
