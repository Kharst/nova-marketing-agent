<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap');
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;background:radial-gradient(circle at 80% 10%,#16406f 0,#0A2342 55%);color:#fff;font-family:'DM Sans',Arial,sans-serif;position:relative;overflow:hidden}
.pad{position:absolute;inset:72px;display:flex;flex-direction:column;justify-content:space-between}
.logo{height:64px;width:auto;align-self:flex-start}
.tag{color:#d9b84e;font-weight:700;letter-spacing:.14em;font-size:26px;margin-bottom:28px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:84px;line-height:1.08;margin-bottom:30px}
p{font-size:36px;line-height:1.35;color:#c9d6ea;max-width:860px}
.shot{margin:0 0 24px;border-radius:18px;border:3px solid #d9b84e;width:100%;max-height:430px;object-fit:cover;object-position:top}
.bar{height:10px;width:220px;background:#d9b84e;border-radius:6px;margin-top:36px}
.foot{font-size:26px;color:#8fa6c8}
</style></head><body><div class="pad">
<img class="logo" src="{{LOGO}}" alt="Nova Metrics" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'NOVA METRICS',style:'font-weight:700;letter-spacing:.2em;font-size:34px;color:#d9b84e'}))">
<div>{{SHOT}}<div class="tag">{{TAG}}</div><h1>{{HEADLINE}}</h1><p>{{SUBLINE}}</p><div class="bar"></div></div>
<div class="foot">novametricsgroup.com</div>
</div></body></html>
